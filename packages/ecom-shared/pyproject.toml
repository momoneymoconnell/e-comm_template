[project]
name = "ecom-shared"
version = "0.1.0"
description = "Cross-cutting building blocks shared by every e-commerce microservice."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom_shared"]
