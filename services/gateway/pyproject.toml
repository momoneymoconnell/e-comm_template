[project]
name = "ecom-gateway"
version = "0.1.0"
description = "Single public entrypoint: routing, CORS, CSRF and rate limiting."
requires-python = ">=3.12"
dependencies = [
    "ecom-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom_gateway"]
