[project]
name = "ecom-catalog"
version = "0.1.0"
description = "Products, variants, categories and inventory."
requires-python = ">=3.12"
dependencies = [
    "ecom-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # Image processing for uploads. Used to validate that a file really is an
    # image, strip EXIF (which can carry GPS coordinates), and generate
    # web-sized derivatives so product pages are not serving 8MB camera files.
    "pillow>=11.0",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom_catalog"]
