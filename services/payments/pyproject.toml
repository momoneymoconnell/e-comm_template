[project]
name = "ecom-payments"
version = "0.1.0"
description = "Stripe payment intents, webhooks and refunds."
requires-python = ">=3.12"
dependencies = [
    "ecom-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "stripe>=11.4",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom_payments"]
